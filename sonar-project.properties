sonar.projectKey=HotelWiseAPI
sonar.projectName=HotelWiseAPI
sonar.sources=.
sonar.exclusions=**/Migrations/**,**/obj/**,**/bin/**,**/*.designer.cs,**/*.g.cs,**/artifacts/**,**/QdrantDockerFile/**,**/IA_Local/**,**/publish-test/**,**/*Tests*/**,**/_tools/**,**/*.ps1
sonar.tests=.
sonar.test.inclusions=**/*Tests*/**
sonar.coverage.exclusions=**/*Tests*/**,**/*ConsolePOC*/**,**/Program.cs,**/*Dto.cs,**/*Vo.cs,**/*Option*.cs,**/Migrations/**,**/AI/Adapters/**,**/SemanticKernelProviderConfigure.cs,**/ApplicationIAConfig.cs
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.cs.cobertura.reportsPaths=**/coverage.cobertura.xml

# Suppress Obsolete/Deprecation rules (S1133, S1874) so Sonar does not flag [Obsolete] on TokenConfigurationDto or other migrated types
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=csharpsquid:S1133
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.cs
sonar.issue.ignore.multicriteria.e2.ruleKey=csharpsquid:S1874
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.cs
